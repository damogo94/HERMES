[project]
name = "hermes"
version = "0.0.1"
description = "HERMES — herramienta de trading inteligente y (lo más) autónoma para mercados de predicción"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "websockets>=12.0",
]

[project.scripts]
hermes = "hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]
